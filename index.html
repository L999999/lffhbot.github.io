<script>
    // 30篇日记完整数据
    const allDiaries = [
        { id: "y_pre1", date: "崇祯八年 春 三月十二 晴", content: "<p>今日，她娘告诉我，我们有孩子了。</p><p>我愣了很久。她娘以为我不高兴，推了我一把。我说不是，我是高兴傻了。</p><p>晚上睡不着，躺在榻上想——孩子叫什么名字？长得像谁？是男是女？想了半夜，没想出来。她娘翻了个身，嘟囔了一句“别想了，睡吧”。</p><p>我嗯了一声，还是没睡着。</p><p>天快亮的时候，我爬起来，去院里站了一会儿。晨风里有桂花的香味，淡淡的。我想，这孩子，得生在好时候才行。可眼下这世道，什么时候才算好时候？</p><p>算了。不管什么世道，我方亨的孩子，我来护着。</p>" },
        { id: "y_pre2", date: "崇祯八年 秋 八月十五 月圆", content: "<p>中秋。她娘的肚子已经显了。</p><p>大哥送来一篮子石榴，说多子多福。三弟送来一坛酒，被大哥瞪了一眼，说孕妇不能喝。三弟挠挠头，又把酒抱回去了。晚舟送了一本《诗经》，说给孩子启蒙用。厚敦送来一块布料，说给孩子做衣裳。</p><p>她娘摸着肚子，跟我说：“这孩子，还没出生就收了这么多礼，以后怕是要还。”</p><p>我说：“不用还。有我在，她什么都不用还。”</p><p>夜里，我坐在院子里赏月。月亮又圆又亮。我对着月亮许了个愿——愿我的孩子，一生平安，顺遂无虞。</p><p>许完愿又觉得自己可笑。方亨啊方亨，你什么时候也信这个了？</p><p>可不信又能怎样呢。这世道，我什么都算不准。唯独这个愿，我许了一辈子。</p>" },
        { id: "y_pre3", date: "崇祯九年 秋 十月廿三 阴雨", content: "<p>她娘身子重了，走路都费劲。我让她别去衙门了，在家歇着。她说我不放心你一个人。我说我在衙门能有什么事，不就是审审案子、批批公文。她说你就是太拼命，我怕你累着。</p><p>我没再劝。她这个人，倔。跟我一样倔。</p><p>夜里，她忽然说：“方亨，你说这孩子以后像谁好？”</p><p>我说：“像你。像你好看。”</p><p>她笑了：“你就知道哄我。像你才好，你聪明。”</p><p>我说：“聪明什么，我就是个芝麻官。”</p><p>她说：“芝麻官也是官。你可别让孩子跟你似的，一辈子操劳。”</p><p>我没说话。操劳就操劳吧。只要她平安，我操劳一辈子都行。</p>" },
        { id: "y0_1", date: "崇祯九年 冬 十二月廿九 阴雨", content: "<p>今日，大小姐出生了。</p><p>她娘疼了整整一天一夜，嗓子都喊哑了。我站在产房外头，腿发软，手心里全是汗。稳婆出来的时候，我差点没站住。</p><p>“是个千金，母女平安。”</p><p>我冲进去，看见她娘脸色惨白，怀里抱着一个皱巴巴的小东西。那小东西眼睛还没睁开，嘴巴一瘪一瘪的，像在找什么。</p><p>她娘说：“你抱抱。”</p><p>我不敢。我手抖。</p><p>她娘笑我：“方大人，审案都不怕，怕抱闺女？”</p><p>我硬着头皮接过来。好轻，轻得像我手里空荡荡的官帽。她突然哭了一声，声音细细的，像猫叫。我整个人僵住了，一动不敢动。</p><p>她娘说：“你哄哄她。”</p><p>我张了张嘴，不知道说什么。最后憋出一句：“别哭了，爹在呢。”</p><p>她还真不哭了。</p><p>窗外阴雨绵绵，江阴城湿冷湿冷的。我抱着她，站在窗前，忽然觉得这辈子，值了。</p>" },
        { id: "y0_2", date: "崇祯十年 正月 初六 晴", content: "<p>今日洗三。</p><p>老规矩，要请收生姥姥来给丫头洗澡。大哥、三弟、晚舟、厚敦都来了，围了一屋子。三弟那个莽夫，还带了把木剑来，说要给侄女“镇宅”。被大哥瞪了一眼，缩回去了。</p><p>丫头被脱光了放在铜盆里，小手小脚蹬来蹬去，哭得撕心裂肺。她娘在旁边心疼得直掉眼泪，我倒是笑了。</p><p>哭声响亮，说明身子骨结实。</p><p>收生姥姥说：“这孩子嗓门大，将来是个有主见的。”</p><p>我心想：有主见好，别像她爹，一辈子看人脸色。</p><p>晚上，她娘问我：“你想好名字了吗？”</p><p>我说：“想好了。叫方圆。”</p><p>她娘问：“什么讲究？”</p><p>我没说铜板的事，只说：“天圆地方，做人要外圆内方。”</p><p>她娘想了想，说：“好。方圆，好听。”</p><p>我在心里头补了一句：方圆，也是爹这辈子，最圆的月亮。</p>" },
        { id: "y0_3", date: "崇祯十年 腊月 廿九 阴", content: "<p>大小姐周岁。</p><p>抓周。桌上摆了算盘、毛笔、铜板、胭脂、小木剑。</p><p>丫头坐在桌上，看看这个，看看那个。然后一把抓住了——铜板。</p><p>三弟哈哈大笑：“二哥，你闺女随你，财迷！”</p><p>我也笑。笑着笑着，眼眶有点热。</p><p>她娘问她：“方圆，你要这个？”</p><p>丫头把铜板攥得紧紧的，另一只手又去够毛笔。左手铜板，右手毛笔。</p><p>晚舟说：“这孩子，既能持家，又能修史。”</p><p>我没说话。我心里想的是：她以后想做什么就做什么，不用管别人怎么说。</p><p>晚上，她娘睡着了。我偷偷把那枚铜板从丫头手里抽出来，发现铜板上全是她的口水。我擦了擦，收进怀里。</p><p>这枚铜板，我替她收着。等她长大了，再给她。</p>" },
        { id: "y0_4", date: "崇祯十一年 夏 六月初三 晴", content: "<p>大小姐会叫爹了。</p><p>其实不算叫，是“哒哒哒”地乱喊。她坐在床上，对着我张开手臂，嘴里“哒哒哒”地叫。</p><p>她娘说：“她在喊你。”</p><p>我说：“她喊的是哒哒，不是爹。”</p><p>她娘说：“你应一声试试。”</p><p>我试着应了一声：“哎。”</p><p>丫头笑了，露出两颗小米牙，又喊：“哒哒哒！”</p><p>我又应。</p><p>她喊了一下午，我应了一下午。嗓子都哑了。</p><p>晚上她睡着了，她娘说：“你傻不傻？”</p><p>我说：“不傻。她喊一声，我就应一声。她喊一辈子，我就应一辈子。”</p><p>她娘没说话，转过身去。我看见她肩膀在抖。</p><p>我知道，她不是哭。她是笑我傻。</p>" },
        { id: "y1", date: "崇祯十年 三月初三 晴", content: "<p>今日，大小姐满月。</p><p>大哥送来一筐鸡蛋，三弟送来一把木剑（这莽夫，送什么剑），晚舟送来一套文房四宝，厚敦送来一包红糖——他说他也不知道送什么，看街上卖红糖的，就买了。</p><p>我把这些东西堆在桌上，抱着她，在院子里转了三圈。</p><p>她没哭。眼睛睁得大大的，盯着我看了好一会儿，然后打了个哈欠，睡着了。</p><p>名字的事，我想了好几天。</p><p>翻书？不翻。我这辈子最烦的就是那些之乎者也。</p><p>我盯着桌上的铜板看了半天。外圆内方。圆的是处世，方的是骨头。就叫方圆。</p><p>大小姐，你以后就知道了。这个名字，是你爹我这一辈子，最得意的一笔。不是当官，不是升迁，是给你取了这么个好名字。</p><p>晚上，我偷偷在铜板上刻了“方圆”两个字。等她长大了，给她。</p>" },
        { id: "y1_5", date: "崇祯十一年 冬 腊月初八 雨", content: "<p>大小姐一岁半了。开始学走路，摇摇晃晃的，像只小鸭子。</p><p>她娘让她扶着墙走，她不干，非要自己走。走了两步就摔了，趴在地上哇哇哭。我跑过去要抱，她娘拦住我：“让她自己起来。”</p><p>丫头哭了一会儿，见没人理她，自己爬起来，又走。走了三步，又摔。</p><p>这样摔了四五回，她终于能稳稳当当地走上七八步了。走到我面前，张开手臂，嘴里喊：“哒哒！”</p><p>我一把抱起她，说：“大小姐真厉害。”</p><p>她咯咯地笑，口水蹭了我一脸。</p><p>她娘在旁边说：“你惯着她吧，以后有你受的。”</p><p>我说：“受就受。我乐意。”</p>" },
        { id: "y2", date: "崇祯十二年 腊月二十三 雨夹雪", content: "<p>大小姐三岁了。</p><p>她今天问我：“爹，我娘呢？”</p><p>我说：“你娘去了很远的地方。”</p><p>她又问：“她为什么不回来？”</p><p>我说：“她回不来了。可她给你留了一样东西。”</p><p>“什么？”</p><p>“她把你留给了我。”</p><p>大小姐没听懂，跑去追蝴蝶了。</p><p>我站在院子里，站了很久。冷雨落在肩上，没觉得凉。</p><p>她娘走的时候，拉着我的手说：“方亨，你这个人，一辈子只会算计。可你别把咱闺女也算计进去。”</p><p>我说：“不算计。她是我方亨的命。”</p>" },
        { id: "y2_5", date: "崇祯十三年 秋 九月十五 晴", content: "<p>大小姐四岁了。开始认字。</p><p>我教她写自己的名字。“方”字好写，“圆”字笔画多，她写不来，写成了“口员”。</p><p>我说：“不对，圆是外面一个框，里面一个员。”</p><p>她想了想，在纸上画了一个大圆圈，里面写了一个“员”字，抬头问我：“爹，这样行吗？”</p><p>我看了半天，说：“行。大小姐写的，什么都行。”</p><p>她高兴了，把那张纸贴在自己床头。贴完了问我：“爹，什么叫方圆？”</p><p>我说：“外圆内方。就是说，做人要圆融，但心里要有原则。”</p><p>她眨眨眼：“听不懂。”</p><p>我说：“听不懂没关系。你长大了就懂了。”</p><p>她“哦”了一声，跑出去玩了。那张“口员”的纸在床头贴了很久，直到发黄了，我都没舍得揭下来。</p>" },
        { id: "y3", date: "崇祯十四年 五月初五 晴", content: "<p>大小姐五岁了。</p><p>今天她把我最心爱的砚台搬走了，在上面栽了几株野花。</p><p>我假装生气，追着她满院子跑。她笑得咯咯的，跑得比我快。</p><p>跑累了，她蹲在墙角，喘着气说：“爹，你跑不动了，你老了。”</p><p>我说：“爹不老，爹还能背你去买马蹄酥。”</p><p>她伸出手臂：“抱。”</p><p>我抱起她，往街上走。</p><p>她在怀里问我：“爹，你为什么老是给我买马蹄酥？”</p><p>我说：“因为你爱吃。”</p><p>她说：“那你爱吃吗？”</p><p>我说：“爹不爱吃，甜的。”</p><p>她掰了一块，塞进我嘴里：“你尝尝，可好吃了。”</p><p>我嚼了。甜的。确实是甜的。</p>" },
        { id: "y3_5", date: "崇祯十四年 冬 腊月三十 阴", content: "<p>除夕。大小姐五岁半了。</p><p>今年她娘不在了，家里冷清了许多。我煮了饺子，丫头吃了六个，说饱了。我说再吃两个，长高高。她说爹你喂我。</p><p>我喂她。她吃了两个，又说：“爹你也吃。”</p><p>我说好。</p><p>吃完了，她坐在我腿上，问我：“爹，你想娘吗？”</p><p>我说想。</p><p>她说：“我也想。”</p><p>沉默了一会儿，她忽然说：“爹，你别怕。我陪着你。”</p><p>我鼻子一酸，差点没忍住。我说：“好。爹不怕。有你呢。”</p><p>她点点头，窝在我怀里睡着了。</p><p>我抱着她，坐了很久。窗外的爆竹声一阵一阵的，我一句都没听进去。</p>" },
        { id: "y4", date: "崇祯十五年 八月十五 月圆", content: "<p>大小姐七岁。今日中秋。</p><p>晚上，我带她去街上逛灯市。她骑在我脖子上，小手揪着我的耳朵，一会儿要往东，一会儿要往西。</p><p>她看中了一盏兔子灯，说什么都不走了。</p><p>我摸摸兜里，就剩几个铜板。买了灯，就没钱买马蹄酥。</p><p>她眨眨眼：“不要马蹄酥，要灯。”</p><p>我买了。</p><p>她提着那盏灯，走了整整一条街。回去的路上，她在怀里睡着了，手还攥着灯不放。</p><p>我把她放在床上，想把灯拿开。她迷迷糊糊睁开眼，说：“爹，明天还看灯。”</p><p>我说：“看。年年都看。”</p>" },
        { id: "y5", date: "崇祯十五年 腊月三十 阴冷", content: "<p>除夕。大小姐在院子里玩，冻得小手通红。</p><p>她把自己的围巾解下来，要给石狮子系上。我说：“回屋吧，别冻着了。”</p><p>她说：“石狮子冷。”</p><p>我说：“石头不怕冷。”</p><p>她想了想，说：“那爹怕不怕冷？”</p><p>我说：“爹不怕。”</p><p>她说：“那爹陪我一起。”</p><p>我蹲下来，陪她。她把手塞进我袖子里，说：“爹，你的手好热。”</p><p>我把她抱起来，说：“进屋。再待下去，你就着凉了。”</p><p>她在我怀里说：“爹，明年除夕，我们还一起守岁。”</p><p>我说：“好。”</p>" },
        { id: "y6", date: "崇祯十六年 六月初六 晴", content: "<p>今日祭祖。大小姐快九岁了。</p><p>她站在祠堂里，跟着念祖训。念到“望江阴儿郎，后继有人”的时候，她扭头看了我一眼，小声问：“爹，我是女儿，算不算儿郎？”</p><p>我说：“算。你是大小姐，比儿郎还厉害。”</p><p>她笑了，露出两颗缺了的门牙。</p><p>大哥在旁边瞪我，说我祭祖的时候不庄重。</p><p>我心想：庄重什么？我闺女笑了，比什么都庄重。</p>" },
        { id: "y7", date: "崇祯十六年 十月 秋 有风", content: "<p>大小姐开始学算卦了。</p><p>其实她哪会算卦，就是装模作样地摇签筒，然后瞎编。</p><p>可她编得真像那么回事。</p><p>那天她给我算了一卦，说：“爹，你近日有血光之灾，不宜出门。”</p><p>我说：“爹今天哪儿都不去，就在家陪你。”</p><p>她说：“算你识相。”</p><p>然后她跑出去玩了。</p><p>晚上，我在书房批公文，不小心被纸割破了手指。</p><p>还真有血光之灾。</p><p>这丫头，瞎猫碰上死耗子。</p>" },
        { id: "y8", date: "崇祯十七年 正月初七 阴", content: "<p>大小姐十岁了。</p><p>她今天问我：“爹，你为什么总是收那些商人的银子？”</p><p>我说：“爹没……”</p><p>她打断我：“你别骗我。我看见过。”</p><p>我沉默了。</p><p>她又说：“你是不是有什么难处？你跟我说，我不告诉别人。”</p><p>我看着她的眼睛。那双眼睛，跟她娘一模一样。太聪明了，什么都瞒不住。</p><p>我说：“大小姐，有些事，爹现在不能告诉你。等以后，你就知道了。”</p><p>她看了我一会儿，说：“行。那我等你告诉我。”</p><p>然后她转身走了。</p><p>走了几步，又回头说：“爹，你别做坏事。你要是做了坏事，我就不理你了。”</p><p>我点头。</p><p>她走了以后，我在书房坐了很久。</p><p>大小姐，爹不会做坏事。爹做的每一件事，都是为江阴，为你。可现在不能说。说了，你就跟着担惊受怕了。</p>" },
        { id: "y9", date: "崇祯十七年 三月 清明 雨", content: "<p>今日去城外祭拜她娘。</p><p>大小姐跪在坟前，磕了三个头，说：“娘，我长大了。我会照顾爹的。”</p><p>我在旁边听着，鼻子一酸。</p><p>她站起来，拍拍膝盖上的泥，说：“爹，走吧。回去给我买马蹄酥。”</p><p>我说：“好。”</p><p>路上，她突然问：“爹，你以后会不会不要我了？”</p><p>我说：“不会。”</p><p>她说：“那你要说话算话。”</p><p>我说：“算话。”</p><p>她伸出手指：“拉钩。”</p><p>我伸出手，跟她拉钩。</p><p>她的手小小的，热热的。</p>" },
        { id: "y10", date: "崇祯十七年 六月初六 晴", content: "<p>今日祭祖。大小姐又长高了一点。</p><p>大哥让她跟着晚舟学修撰。她不乐意，但还是去了。</p><p>我知道她不乐意的原因——她怕自己学不好，丢我的脸。</p><p>傻丫头，你学得好不好，都是我方亨的女儿。丢什么脸？</p><p>可她不知道。她以为我在乎这些。</p><p>我什么都不在乎。我只在乎她开不开心。</p>" },
        { id: "y11", date: "崇祯十七年 八月十五 月圆", content: "<p>中秋。大小姐穿着新衣裳，在院子里赏月。</p><p>我给她买了马蹄酥。她掰了一块，递给我：“爹，你尝尝。”</p><p>我说：“爹不吃。”</p><p>她说：“你尝尝嘛。我特意让人少放了糖。”</p><p>我接过来，吃了。确实不甜。可她笑得甜。</p>" },
        { id: "y11_5", date: "崇祯十七年 九月廿三 阴", content: "<p>常州府传来密信，清军已破山海关，京师沦陷。朝廷南迁，人心惶惶。</p><p>今日，一个自称“清廷特使”的人来到县衙，递给我一封密函。信上写着：若江阴知县方亨愿归顺大清，可保官职，甚至擢升。否则，城破之日，鸡犬不留。</p><p>我没有当场答复。特使笑了笑，留下一句“方大人慢慢考虑”，便扬长而去。</p><p>夜里，我把密函烧了。火光映在墙上，像一条扭曲的蛇。</p><p>我想起大哥。想起他站在城墙上，对着江阴百姓说“人在城在”。想起他每次祭祖时念“望江阴儿郎，后继有人”。想起他那张永远板着的脸，和那双永远温和的眼睛。</p><p>我若是降了，大哥会怎样？他会骂我，会恨我，会当没我这个兄弟。可他会活着。</p><p>江阴也会活着。</p><p>这个念头在我脑子里转了一整夜。天亮时，我提笔给那个特使写了一封信，措辞恭敬，只说“容方某再考虑些时日”。</p><p>信寄出去，我坐在书房里，半天没动。</p><p>大小姐推门进来，问我：“爹，你怎么不吃饭？”</p><p>我说：“爹不饿。”</p><p>她看了看我，没再问，转身走了。走了几步，又回头说：“爹，你别做坏事。”</p><p>我没说话。</p><p>大小姐，爹要做的事，比坏事还坏。可爹不做，你们就活不成。</p>" },
        { id: "y11_6", date: "崇祯十七年 腊月十五 雨", content: "<p>清廷特使又来催了。这一次，他带来了更明确的条件：清军即将南下，常州、无锡均已暗中归顺。若江阴不从，将被列为“顽抗之城”，城破后屠城三日。</p><p>我问他：“若我方亨归顺，江阴百姓可免一死？”</p><p>他笑了笑：“方大人，您是个聪明人。大清要的是顺从的臣民，不是尸骨。只要江阴剃发易服，百姓自可安居乐业。”</p><p>我说：“好。容我再想想。”</p><p>他走后，我在县衙后院里站了很久。雨打在脸上，冷得刺骨。</p><p>我想起大哥说过的话：“家，就是一个人都不能少。”可如今，这个“家”，是江阴城，是几万条命。我若选了忠，他们都要死。我若选了降，至少能活一部分。</p><p>这笔账，我算了一辈子，从来没有哪一笔，算得这么难。</p><p>夜里，我写了一封长信给方圆。信里什么都没说，只说“爹升官了，要去常州，你先去你大伯家住”。</p><p>写完了，又撕了。写了又撕，撕了又写。最后定下来的那封，只有寥寥数语。</p><p>大小姐，等你收到这封信的时候，爹已经走了。不是升官。是去当叛徒。</p><p>你别哭。你哭了，爹就舍不得了。</p><p>信没寄。压在枕头底下。</p>" },
        { id: "y11_7", date: "崇祯十七年 腊月廿五 夜 雨", content: "<p>今夜，我偷偷回了江阴。没有进城，只站在北门外的山坡上，远远望着城里的灯火。</p><p>陈府的灯还亮着。大哥应该还在书房批公文。大小姐的房间里，烛火晃了晃，是她起身添灯油。</p><p>我想进去。想抱抱她。想跟她说一声“爹对不起你”。</p><p>可我不能。</p><p>我站在山坡上，淋着雨，站了两个时辰。直到陈府的灯一盏一盏灭了，直到大小姐房间的烛火也暗了。</p><p>我对着那个方向，低声说了一句：“大小姐，爹走了。你别恨爹。等爹死了，你再恨。”</p><p>雨声太大，没人听见。</p><p>我转身回了常州。第二天染了风寒，烧了两天。没人来看我。也不敢让人知道。</p><p>病中恍惚，梦见大小姐小时候骑在我脖子上，揪着我的耳朵说：“爹，我要看兔子灯。”</p><p>我梦见自己说：“看。年年都看。”</p><p>醒来的时候，枕头湿了一片。</p>" },
        { id: "y12", date: "弘光元年 正月初八 阴", content: "<p>常州府的调令来了。我要走了。</p><p>不是升官。是去当“叛徒”。</p><p>可我怎么说？我不能说。</p><p>我跟她说：“大小姐，爹升官了。爹被调去常州府，你先去你大伯家住一段时日。”</p><p>她斜着眼看我：“骗人。你就是怕了我，想躲几天吧？”</p><p>我笑着摇头：“不是不是。你看，这是朝廷下来的批文。”</p><p>她瞟了一眼批文，说：“切。也好，我整日看你就心烦。去我大伯那，也算静心。”</p><p>她嘴上这么说，可收拾行李的时候，她磨磨蹭蹭，什么都没带。</p><p>我给她收拾了十多个包袱，连铜镜、梳子都装进去了。</p><p>她说：“你是不是想给我送到陈府，盼着你自己不回来了？”</p><p>我说：“哪有。”</p><p>她最后还是只带了顾叔，什么都没拿。</p><p>我拖着那一大堆行李，送了她一路。她头也不回。</p><p>走到城门口，我说：“让老臣抱一下。”</p><p>她没回头。</p><p>我站在那儿，看着她的背影。</p><p>她走了几步，突然停下来。</p><p>我以为她会回头。</p><p>她没有。她继续走了。</p><p>我站了很久，直到看不见她了。落日熔金，官道上只剩我一个人。</p><p>我转身，走了。走得很快。怕自己回头。</p>" },
        { id: "y13", date: "弘光元年 正月十五 元宵", content: "<p>今日元宵。常州府的灯市很热闹。我一个人站在衙门口，看着人来人往。</p><p>有个小女孩骑在她爹脖子上，手里提着一盏兔子灯。</p><p>她爹说：“下来吧，爹累了。”</p><p>小女孩说：“不，我还要看。”</p><p>她爹说：“好好好，看。年年都看。”</p><p>我转过身，回了屋。枕头底下，有块马蹄酥。是我从江阴带来的。已经硬了。</p><p>我掰了一块，塞进嘴里。嚼不动。可我没吐。</p>" },
        { id: "y14", date: "弘光元年 五月初五 端午 晴", content: "<p>大小姐给我写信了。不是写给我的。是写给“元方”的。她不知道“元方”就是我。</p><p>信上写：“元方大善人，江阴今年雨水多，城西的桥塌了，需要银子修缮。方圆敬上。”</p><p>我看着信，笑了。这丫头，拿我的银子做善事，还瞒着我。</p><p>我让人送了一百两银子过去。署名“元方”。</p><p>晚上，我又收到一封信。这回是写给我的。信上只有一句话：“爹，我想你了。”</p><p>我看了一遍，又看了一遍。然后把信折好，塞进枕头底下。跟那块硬了的马蹄酥放在一起。</p>" },
        { id: "y15", date: "弘光元年 七月初七 七夕 夜 星", content: "<p>今日，暗探告诉我，大小姐在江阴，被人绑去做“压寨夫人”了。我一听，差点没把桌子掀了。谁？谁这么大胆子？</p><p>后来一查，是杨玉笙那小子。关宁会的二当家，袁崇焕的儿子。</p><p>我派人去查他的底细。查完了，我反倒不气了。这小子，是个有骨气的。而且，他对大小姐，是真的。</p><p>可我嘴上不能这么说。我得骂。骂给清军看。我写信给大小姐：“杨玉笙那小子，你离他远点。”</p><p>信寄出去以后，我又写了一封，没寄。上面写着：“杨玉笙，你对我闺女好点。你要是敢欺负她，我方亨把你腿打折。”这封信，我烧了。不能寄。寄了，就穿帮了。</p>" },
        { id: "y16", date: "弘光元年 八月十五 中秋 月圆", content: "<p>今日，我假扮顾元方，回了江阴。站在角落里，看着大小姐吃马蹄酥。</p><p>她瘦了。眼睛底下有青黑，没睡好。她咬了一口马蹄酥，皱了皱眉。大概觉得不够甜。</p><p>老臣做的，当然不够甜。老臣心里头苦，做出来的东西，能甜到哪去？可她还是吃完了。吃得干干净净。</p><p>我站在那儿，看着这满堂的家人。大哥在发月饼，三弟在给晚舟递红豆馅的，厚敦站在杨小池旁边，脸红得像煮熟的虾。稷儿和芙蓉挨着坐，玉笙那小子盯着方圆，眼睛都不带眨的。</p><p>还有你，大小姐。你又长高了。可你还是那个爱吃马蹄酥、爱装神弄鬼算卦、爱跟我顶嘴的大小姐。</p><p>我想走过去，喊一声“大小姐”。可我戴着面具。我是个“又聋又哑”的老仆人。我不能说话。</p><p>我站了一会儿，转身走了。走的时候，袖子底下攥着那枚刻着“方圆”二字的铜板。攥得手心发疼。</p>" },
        { id: "y17", date: "弘光元年 八月二十二 夜 无星", content: "<p>明日，就是剃发令的最后一日了。大哥不会降。三弟不会降。谁都不会降。他们会死。我也会死。</p><p>可密道里那五十三个人，会活着。大小姐，你会活着。</p><p>老臣这辈子，欠你太多。欠你一个完整的家，欠你一个清清白白的爹，欠你无数个中秋和除夕，欠你一句“女儿，爹想你了”。还不上。只能用这条命抵。</p><p>老臣在清军营帐里，给你写这最后一篇日记。</p><p>那些马蹄酥，老臣每年都做了。放在枕头底下，硬了，扔了，再做。那些铜板，老臣攒了。一百五十五两，七十六枚。是你爹我这辈子，最干净的银子。</p><p>那枚刻着“方圆”二字的铜板，老臣带走了。带到黄泉路上。想你了，就摸一摸。</p><p>大小姐，你往后吃马蹄酥的时候，别嫌不够甜。老臣心里头不苦了。你活着，老臣就不苦了。你往前走。不用回头。老臣在身后，替你看着。没有鞑子。放心走。</p><p style=\"margin-top:1rem; text-align:right;\">子时三更，平安无事。<br>方亨 绝笔<br>弘光元年 八月二十二 夜</p>" }
    ];

    function renderToc() {
        const tocGrid = document.getElementById('tocList');
        tocGrid.innerHTML = '';
        allDiaries.forEach(diary => {
            const link = document.createElement('a');
            link.href = `#${diary.id}`;
            link.textContent = diary.date;
            tocGrid.appendChild(link);
        });
    }

    function renderDiaries() {
        const container = document.getElementById('diariesContainer');
        container.innerHTML = '';
        allDiaries.forEach((diary, idx) => {
            const entryDiv = document.createElement('div');
            entryDiv.className = 'diary-entry';
            entryDiv.id = diary.id;
            entryDiv.innerHTML = `
                <div class="entry-date">${diary.date}</div>
                <div class="entry-content">${diary.content}</div>
            `;
            container.appendChild(entryDiv);
            if (idx < allDiaries.length - 1) {
                const hr = document.createElement('hr');
                hr.className = 'divider';
                container.appendChild(hr);
            }
        });
    }

    function renderAppendix() {
        const appendixDiv = document.getElementById('appendix');
        appendixDiv.innerHTML = `
            <h3>📜 整理者后记</h3>

                <p>数百年后，江阴北山密道遗址清理时，于青砖夹层中发现一油纸包裹。内有一枚刻着“方圆”二字的铜板、七十六枚铜钱、一封字迹模糊的信，以及这本被血渍浸染的日记册页。纸张残损，字迹多处漫漶，经后人逐一辨识、补全，方成今日之貌。</p>
                <p>方亨一生，贪名在外，忠骨在内。他不求青史留名，只求女儿平安，江阴火种不灭。这本日记，是他留给后世唯一的自白。</p>

            <div class="list-box">
                <ul>
                    <li>铜板一枚，上刻“方圆”二字（亲手所刻，自幼随身）</li>
                    <li>散碎银两：一百五十五两，铜钱七十六枚（任常州县令期间全部俸禄）</li>
                    <li>马蹄酥制作手札一份（含配方、火候、甜度调整记录）</li>
                    <li>空白卦签一筒（原为方圆所用，方亨暗中补充）</li>
                    <li>密道手绘图一张（标注岔路口及生门方向）</li>
                    <li>家谱残页一纸（方亨之名被陈明遇重新贴回后的拓印）</li>
                    <li>未寄出的信三封（收件人均为方圆，因怕暴露身份而未发出）</li>
                </ul>
            </div>
            <div class="disclaimer">
                <strong>📌 免责声明</strong><br>
                剧本杀《流芳》中的“方亨”为艺术再创作角色，其暗中抗清、以身入局等情节均属虚构。据史料记载，历史上的方亨（明末清初江阴知县）在清军南下时剃发降清，并协助清廷推行剃发令，是史有定论的“叛徒”。本日记完全基于剧本《流芳》的虚构剧情创作，请勿与真实历史人物混淆。故事虽假，情义为真；愿玩家在感动之余，亦能明辨史实与创作之界。

            <div class="signature">
                —— 纸短情长，骨血不散。江阴旧卷，永藏人间。
            </div>
        `;
    }

    renderToc();
    renderDiaries();
    renderAppendix();

    // 全面防复制（禁止右键、复制、剪切、拖拽、选择；禁用F12等开发者快捷键）

    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (e.ctrlKey && e.key === 'u')) {
